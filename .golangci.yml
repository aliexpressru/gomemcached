version: "2"
run:
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - asasalint
    - contextcheck
    - copyloopvar
    - dupl
    - errcheck
    - goconst
    - gocritic
    - govet
    - ineffassign
    - ireturn
    - maintidx
    - nilerr
    - nilnil
    - prealloc
    - reassign
    - staticcheck
    - unused
  settings:
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - singleCaseSwitch
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
